
<!DOCTYPE html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>عيد الأضحى - ساره</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <main class="main">
      <div class="floating-hearts" id="floatingHearts" aria-hidden="true"></div>

      <section class="hero">
        <div class="eid-badge">🐑 عيد الأضحى المبارك</div>
        <h1 class="name-title">ساره</h1>
        <p class="subtitle">انت أجمل هديّة في العيد 💗</p>
        <div class="sheep-row" id="sheepRow" aria-hidden="true"></div>
      </section>

      <section class="card-section" id="cardSection"></section>

      <section class="big-message">
        <blockquote class="arabic-quote">
          "كل سنه وانت احلا حاجه في حياتي ✨"
        </blockquote>
      </section>

      <div class="eid-sparkle" aria-hidden="true">🌙 ✨ ☪️ ✨ 🌙</div>

      <footer class="footer-heart">
        <button class="heart-big" id="burstButton" type="button" aria-label="اضغطي على القلب">
          ❤️
        </button>
        <div class="footer-name">كل سنة وإنتِ أحلى يا ساره 🌸</div>
        <p class="footer-hint">اضغطي على القلب 💗</p>
      </footer>
    </main>

    <script src="./script.js"></script>
  </body>
</html>
